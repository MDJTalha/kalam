[project]
name = "corplms-api"
version = "0.1.0"
description = "Corporate LMS API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy>=2.0.43,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "python-multipart>=0.0.20,<0.1",
  "email-validator>=2.3,<3",
  "redis>=6.4,<7",
  "structlog>=25.4,<26"
]
[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "httpx>=0.28,<0.29",
  "ruff>=0.13,<0.14",
  "mypy>=1.17,<2"
]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
