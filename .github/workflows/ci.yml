name: Corporate LMS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: corplms
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d corplms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clamav:
        image: clamav/clamav:1.4.6
        ports:
          - 3310:3310
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/pip install -r requirements.txt
      - name: Dependency integrity
        run: .venv/bin/pip check
      - name: Production dependency audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit -r requirements-prod.txt
      - name: Migrate database
        env:
          DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          APP_ENV: development
          WEB_ORIGIN: http://localhost:3000
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: .venv/bin/alembic upgrade head
      - name: Verify migration head
        env:
          DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          APP_ENV: development
          WEB_ORIGIN: http://localhost:3000
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: .venv/bin/python scripts/check_migration_head.py
      - name: Seed demo data
        env:
          DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          APP_ENV: development
          WEB_ORIGIN: http://localhost:3000
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: .venv/bin/python scripts/seed.py
      - name: Generate ephemeral CI fixture password
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CI_FIXTURE_PASSWORD={secrets.token_urlsafe(32)}\n")
          PY
      - name: Seed API integration fixtures
        env:
          DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          KALAM_TEST_DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          APP_ENV: ci
          WEB_ORIGIN: http://localhost:3000
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: .venv/bin/python scripts/seed_ci_fixtures.py
      - name: Bootstrap SaaS operations roles
        env:
          DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          SAAS_OPS_TENANT_SLUG: kalam
        run: .venv/bin/python scripts/bootstrap_saas_ops.py
      - name: Static checks
        run: .venv/bin/ruff check app tests
      - name: Type checks
        run: .venv/bin/mypy app
      - name: Verify ClamAV transport
        run: |
          for attempt in $(seq 1 90); do
            if .venv/bin/python -c "import socket; s=socket.create_connection(('127.0.0.1', 3310), timeout=3); s.sendall(b'PING\\n'); result=s.recv(100); s.close(); assert result.strip()==b'PONG', result"; then
              echo "ClamAV transport is ready."
              exit 0
            fi
            echo "Waiting for ClamAV signature initialization ($attempt/90)..."
            sleep 10
          done
          clamav_id=$(docker ps -aq --filter ancestor=clamav/clamav:1.4.6 | head -n 1)
          if [ -n "$clamav_id" ]; then docker logs "$clamav_id"; fi
          echo "ClamAV did not become ready within 15 minutes."
          exit 1
      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          KALAM_TEST_DATABASE_URL: postgresql+asyncpg://lms:lms_ci_password@127.0.0.1:5432/corplms
          APP_ENV: ci
          WEB_ORIGIN: http://localhost:3000
          ALLOWED_HOSTS: localhost,127.0.0.1
          FILE_SCAN_PROVIDER: clamd
          FILE_SCAN_HOST: 127.0.0.1
          FILE_SCAN_PORT: 3310
          SAAS_OPS_TENANT_SLUG: kalam
          SAAS_DEMO_CRM_ENABLED: "true"
          MARKETING_INBOX_ENABLED: "true"
          MARKETING_REVIEW_TENANT_SLUG: kalam
          OPENAI_API_KEY: test-only-ci-credential
        run: |
          export KALAM_QA_DEMO_PASSWORD="$CI_FIXTURE_PASSWORD"
          .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev
        working-directory: .
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-release-validation-only
          WEB_ORIGIN: https://lms.example.com
          NEXT_PUBLIC_SITE_URL: https://lms.example.com
          API_ORIGIN: https://lms.example.com/api
          NEXT_PUBLIC_API_ORIGIN: https://lms.example.com/api
          INTERNAL_API_ORIGIN: http://api:8000
          ALLOWED_HOSTS: lms.example.com,api
          OUTBOUND_HTTP_PROXY: http://egress-proxy.example.invalid:3128
        run: |
          docker compose -f infra/docker/docker-compose.app.yml config --quiet
          docker compose -f infra/docker/docker-compose.app.yml config --format json | python -c 'import json,sys; cfg=json.load(sys.stdin); port=cfg["services"]["gateway"]["ports"][0]; assert port["host_ip"] == "127.0.0.1" and port["published"] == "3100", f"Unsafe default gateway binding: {port}"; assert cfg["services"]["api"]["image"] == cfg["services"]["migrate"]["image"], "Migration service must use the exact API image"'
      - name: Validate Nginx policy
        run: docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 -v "$PWD/infra/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29-alpine nginx -t
      - name: Build production images
        env:
          POSTGRES_PASSWORD: ci-release-validation-only
          WEB_ORIGIN: https://lms.example.com
          NEXT_PUBLIC_SITE_URL: https://lms.example.com
          API_ORIGIN: https://lms.example.com/api
          NEXT_PUBLIC_API_ORIGIN: https://lms.example.com/api
          INTERNAL_API_ORIGIN: http://api:8000
          ALLOWED_HOSTS: lms.example.com,api
          OUTBOUND_HTTP_PROXY: http://egress-proxy.example.invalid:3128
        run: docker compose -f infra/docker/docker-compose.app.yml build api web worker
      - name: Smoke built production images
        shell: pwsh
        run: ./infra/scripts/phase8-image-runtime-smoke.ps1
