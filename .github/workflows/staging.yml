name: Kalam Staging Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
  push:
    branches: [main]

concurrency:
  group: kalam-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Record checked-out release commit
        shell: bash
        run: echo "KALAM_DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate staging inputs
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
          STAGING_WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
          STAGING_AI_ENABLED: ${{ vars.STAGING_AI_ENABLED || 'false' }}
          STAGING_AI_PROVIDER: ${{ vars.STAGING_AI_PROVIDER || 'disabled' }}
          STAGING_AI_BASE_URL: ${{ vars.STAGING_AI_BASE_URL || 'https://api.openai.com' }}
          STAGING_AI_MODEL: ${{ vars.STAGING_AI_MODEL || '' }}
          STAGING_OPENAI_API_KEY: ${{ secrets.STAGING_OPENAI_API_KEY }}
          STAGING_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_APP_DIR"
          test -n "$STAGING_WEB_ORIGIN"
          case "$STAGING_AI_ENABLED" in true|false) ;; *) echo "STAGING_AI_ENABLED must be true or false"; exit 1 ;; esac
          if [ "$STAGING_AI_ENABLED" = "true" ] && [ "$STAGING_AI_PROVIDER" = "disabled" ]; then
            echo "A provider type is required when staging AI is explicitly enabled."
            exit 1
          fi
          if [ "$STAGING_AI_ENABLED" = "true" ] && [ -z "$STAGING_AI_MODEL" ]; then
            echo "A model is required when staging AI is explicitly enabled."
            exit 1
          fi
          if [ "$STAGING_AI_ENABLED" = "true" ] && [ "$STAGING_AI_PROVIDER" = "openai_compatible" ] && [ -z "$STAGING_OPENAI_API_KEY" ]; then
            echo "An OpenAI credential is required when staging AI is explicitly enabled."
            exit 1
          fi
          if [ "$STAGING_AI_ENABLED" = "true" ] && [ "$STAGING_AI_PROVIDER" = "anthropic" ] && [ -z "$STAGING_ANTHROPIC_API_KEY" ]; then
            echo "An Anthropic credential is required when staging AI is explicitly enabled."
            exit 1
          fi
          echo "Staging deployment inputs are configured."

      - name: Install SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

      - name: Trust staging host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Deploy exact commit
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
          STAGING_WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_AI_ENABLED: ${{ vars.STAGING_AI_ENABLED || 'false' }}
          STAGING_AI_PROVIDER: ${{ vars.STAGING_AI_PROVIDER || 'disabled' }}
          STAGING_AI_BASE_URL: ${{ vars.STAGING_AI_BASE_URL || 'https://api.openai.com' }}
          STAGING_AI_MODEL: ${{ vars.STAGING_AI_MODEL || '' }}
          STAGING_OPENAI_API_KEY: ${{ secrets.STAGING_OPENAI_API_KEY }}
          STAGING_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export GIT_SHA="${KALAM_DEPLOY_SHA}"
          app_dir_q=$(printf '%q' "$STAGING_APP_DIR")
          git_sha_q=$(printf '%q' "$GIT_SHA")
          web_origin_q=$(printf '%q' "$STAGING_WEB_ORIGIN")
          postgres_password_b64=$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w0)
          ai_enabled_b64=$(printf '%s' "$STAGING_AI_ENABLED" | base64 -w0)
          ai_provider_b64=$(printf '%s' "$STAGING_AI_PROVIDER" | base64 -w0)
          ai_base_url_b64=$(printf '%s' "$STAGING_AI_BASE_URL" | base64 -w0)
          ai_model_b64=$(printf '%s' "$STAGING_AI_MODEL" | base64 -w0)
          openai_api_key_b64=$(printf '%s' "$STAGING_OPENAI_API_KEY" | base64 -w0)
          anthropic_api_key_b64=$(printf '%s' "$STAGING_ANTHROPIC_API_KEY" | base64 -w0)
          ssh -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" "bash -s" <<REMOTE
          set -euo pipefail
          APP_DIR=$app_dir_q
          GIT_SHA=$git_sha_q
          WEB_ORIGIN=$web_origin_q
          POSTGRES_PASSWORD_B64='$postgres_password_b64'
          AI_ENABLED_B64='$ai_enabled_b64'
          AI_PROVIDER_B64='$ai_provider_b64'
          AI_BASE_URL_B64='$ai_base_url_b64'
          AI_MODEL_B64='$ai_model_b64'
          OPENAI_API_KEY_B64='$openai_api_key_b64'
          ANTHROPIC_API_KEY_B64='$anthropic_api_key_b64'
          test -d "\$APP_DIR/.git"
          cd "\$APP_DIR"
          git fetch --prune origin
          git checkout --detach "\$GIT_SHA"
          umask 077
          cat > .env.staging <<EOF
          POSTGRES_PASSWORD=\$(printf '%s' "\$POSTGRES_PASSWORD_B64" | base64 -d)
          WEB_ORIGIN=\$WEB_ORIGIN
          API_ORIGIN=\$WEB_ORIGIN/api
          NEXT_PUBLIC_SITE_URL=\$WEB_ORIGIN
          NEXT_PUBLIC_API_ORIGIN=\$WEB_ORIGIN/api
          INTERNAL_API_ORIGIN=http://api:8000
          ALLOWED_HOSTS=\${WEB_ORIGIN#https://},\${WEB_ORIGIN#http://},api
          AI_ENABLED=\$(printf '%s' "\$AI_ENABLED_B64" | base64 -d)
          AI_PROVIDER=\$(printf '%s' "\$AI_PROVIDER_B64" | base64 -d)
          AI_BASE_URL=\$(printf '%s' "\$AI_BASE_URL_B64" | base64 -d)
          AI_MODEL=\$(printf '%s' "\$AI_MODEL_B64" | base64 -d)
          OPENAI_API_KEY=\$(printf '%s' "\$OPENAI_API_KEY_B64" | base64 -d)
          ANTHROPIC_API_KEY=\$(printf '%s' "\$ANTHROPIC_API_KEY_B64" | base64 -d)
          COOKIE_SECURE=true
          EOF
          docker compose --env-file .env.staging -f infra/docker/docker-compose.app.yml up -d --build --remove-orphans
          docker compose --env-file .env.staging -f infra/docker/docker-compose.app.yml ps
          REMOTE

      - name: Verify staging health
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
        run: |
          ssh -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" "cd '$STAGING_APP_DIR' && docker compose --env-file .env.staging -f infra/docker/docker-compose.app.yml exec -T api python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)\""
          ssh -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" "cd '$STAGING_APP_DIR' && docker compose --env-file .env.staging -f infra/docker/docker-compose.app.yml exec -T gateway wget --spider -q http://127.0.0.1:8080/proxy-health"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/staging_key
