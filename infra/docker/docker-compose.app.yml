services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corplms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - corplms_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-corplms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - corplms_valkey:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_NAME: Corporate LMS API
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-corplms}
      REDIS_URL: redis://valkey:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      API_ORIGIN: ${API_ORIGIN:?API_ORIGIN is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-corp_lms_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      DEV_EMAIL_SINK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../../apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      APP_NAME: Corporate LMS Worker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-corplms}
      REDIS_URL: redis://valkey:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      API_ORIGIN: ${API_ORIGIN:?API_ORIGIN is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEV_EMAIL_SINK: "false"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:?NEXT_PUBLIC_API_ORIGIN is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:8000
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:?NEXT_PUBLIC_API_ORIGIN is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  corplms_postgres:
  corplms_valkey:
