upstream corplms_web {
    server web:3000;
    keepalive 32;
}

upstream corplms_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 30m;
    server_tokens off;

    # Route the browser's stable same-origin LMS API contract directly to FastAPI.
    # This removes an unnecessary Next.js server hop for authenticated data traffic
    # while preserving /api/lms/* URLs used by the web application.
    location ^~ /api/lms/ {
        rewrite ^/api/lms/(.*)$ /api/v1/$1 break;
        proxy_pass http://corplms_api;
        proxy_http_version 1.1;
        proxy_set_header Host api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Some browser components use the FastAPI versioned path directly. Keep it
    # same-origin and route it to the same API upstream as the /api/lms alias.
    location ^~ /api/v1/ {
        proxy_pass http://corplms_api;
        proxy_http_version 1.1;
        proxy_set_header Host api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://corplms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /proxy-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
